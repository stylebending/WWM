[package]
name = "wwm"
version = "0.1.0"
edition = "2021"
description = "Native Rust port of Windows Workspace Manager (phase 1: skeleton, virtual-desktop bindings, hotkeys)"
license = "MIT"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
winvd = "0.0.49"
windows-core = "0.61"
windows058 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Smallest possible release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
